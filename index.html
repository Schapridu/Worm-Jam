<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Worm Jam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-bar">
        <div class="currency" title="Яблука (валюта)">🍎 <span id="coin-counter">0</span></div>
        <div>
            <button id="sound-btn">🔊 Звук: Увімк</button>
            <button id="shop-btn">Магазин 🛒</button>
        </div>
    </div>

    <div class="container">
        <h1>Worm Jam <span id="level-indicator">Рівень 1</span></h1>
        
        <div id="time-bar-bg">
            <div id="time-bar"></div>
        </div>

        <canvas id="gameCanvas" width="640" height="640"></canvas>
        <br>
        <button id="restart-btn">Перезапустити рівень</button>
    </div>

    <!-- Модальне вікно магазину -->
    <div id="shop-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" id="close-shop">&times;</span>
            <h2>Магазин Тераріуму</h2>
            <p class="shop-subtitle">Облаштуйте домівку для ваших червачків!</p>
            <div class="shop-items">
                <div class="shop-item">
                    <h3>Свіжа трава (Фон)</h3>
                    <p>Ціна: 🍎 30</p>
                    <button class="buy-btn" data-cost="30" data-type="bg" data-val="#e1f7d5">Купити</button>
                </div>
                <div class="shop-item">
                    <h3>Піщаний ґрунт (Фон)</h3>
                    <p>Ціна: 🍎 60</p>
                    <button class="buy-btn" data-cost="60" data-type="bg" data-val="#f5e6d3">Купити</button>
                </div>
                <div class="shop-item">
                    <h3>Темний ліс (Фон)</h3>
                    <p>Ціна: 🍎 120</p>
                    <button class="buy-btn" data-cost="120" data-type="bg" data-val="#2d3436" data-text="#fff">Купити</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
